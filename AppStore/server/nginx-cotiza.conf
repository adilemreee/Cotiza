# Cotiza: public pages (home, privacy, support, terms; English at /, Spanish at /es/, Turkish at /tr/),
# and signing links (/s/<id>, /api/v1/...) served by the cotiza-sign container on 127.0.0.1:4130.
# Only reachable through the Cloudflare tunnel (cotiza.adilemree.xyz).
server {
    listen 127.0.0.1:8133;
    server_name cotiza.adilemree.xyz;

    root /var/www/cotiza;
    index index.html;

    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Signing links: the client's page and the app's API (Server/sign, /opt/cotiza-sign).
    location ~ ^/(s|api/v1)/ {
        proxy_pass http://127.0.0.1:4130;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 7m;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
